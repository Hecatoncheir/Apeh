name: Когнитивная сложность Dart

on:
  pull_request:
    paths:
      - '**/*.dart'
      - '.github/workflows/dart-complexity.yml'
      - '.github/scripts/dart-complexity.lua'
  push:
    branches: [main]
    paths:
      - '**/*.dart'
      - '.github/workflows/dart-complexity.yml'
      - '.github/scripts/dart-complexity.lua'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complexity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Подготовить Neovim и анализатор
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/neovim/neovim/releases/download/v0.11.5/nvim-linux-x86_64.tar.gz \
            --output "$RUNNER_TEMP/nvim.tar.gz"
          cd "$RUNNER_TEMP"
          echo 'b2f91117be5b5ea39edd7297156dc2a4a8df4add6c95a90809a8df19e7ab6f52  nvim.tar.gz' | sha256sum --check
          tar -xzf nvim.tar.gz
          git init -q complexity
          git -C complexity fetch -q --depth=1 \
            https://github.com/Hecatoncheir/treesitter_cyclomatic_complexity.git 7b216f2344d87a910e6c1ffbd974fe60950c15ce
          git -C complexity checkout -q --detach FETCH_HEAD
          (cd complexity && bash scripts/install-parsers.sh)

      - name: Сравнить сложность Dart-функций
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            BASE=$(git merge-base "$BASE" "$HEAD_SHA")
          elif [[ -z "$BASE" ]]; then
            BASE=$(git rev-parse "$HEAD_SHA^")
          elif [[ "$BASE" =~ ^0+$ ]]; then
            BASE=$(git hash-object -w -t tree --stdin </dev/null)
          fi
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --headless -u NONE \
            --cmd "set rtp+=$RUNNER_TEMP/complexity,$RUNNER_TEMP/complexity/.ci/parsers" \
            -l .github/scripts/dart-complexity.lua "$BASE" "$HEAD_SHA"
