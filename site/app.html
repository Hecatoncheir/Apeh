<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3e9">
  <title>Apeh — прототип приложения</title>
  <link rel="icon" href="assets/apeh-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
  <script src="demo-data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="app">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="./" aria-label="Apeh, на сайт"><img src="assets/apeh-mark.svg" width="42" height="42" alt=""><img src="assets/apeh-logo.svg" width="82" height="33" alt="Apeh"></a>
      <nav class="app-nav" aria-label="Разделы приложения">
        <a href="#maps" data-tab="maps"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#maps"/></svg> Карты</a>
        <a href="#legends" data-tab="legends"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#legends"/></svg> Легенды</a>
        <a href="#weapons" data-tab="weapons"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#weapons"/></svg> Оружие</a>
        <a href="#builds" data-tab="builds"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#builds"/></svg> Сборки</a>
      </nav>
      <a class="back-link" href="./"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#external"/></svg> На сайт</a>
    </aside>
    <main class="workspace">
      <header class="workspace-top">
        <span class="demo-badge"><span></span> Демо-данные</span>
        <div class="map-tools" id="map-tools">
          <label class="timezone">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#clock"/></svg>
            <select id="timezone" aria-label="Часовой пояс">
              <option value="local">Местное время</option>
              <option value="Europe/Moscow">Москва · UTC+3</option>
              <option value="UTC">UTC</option>
              <option value="Asia/Yekaterinburg">Екатеринбург · UTC+5</option>
              <option value="Asia/Novosibirsk">Новосибирск · UTC+7</option>
              <option value="Asia/Vladivostok">Владивосток · UTC+10</option>
            </select>
          </label>
          <button class="button secondary reminders-button" id="open-reminders" type="button" aria-label="Напоминания"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#bell"/></svg> <span>Напоминания</span></button>
        </div>
      </header>
      <section id="screen" aria-labelledby="screen-title"></section>
      <footer class="workspace-footer">
        <span>Прототип Apeh</span>
        <a href="https://apexlegendsstatus.com/">Apex Legends Status <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#external"/></svg></a>
      </footer>
    </main>
  </div>
  <dialog id="details" aria-labelledby="dialog-title">
    <div class="dialog-top">
      <h2 id="dialog-title"></h2>
      <form method="dialog"><button class="icon-button" aria-label="Закрыть"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#close"/></svg></button></form>
    </div>
    <div id="dialog-content"></div>
  </dialog>
  <div id="toast" role="status" class="toast" hidden></div>
  <noscript><p class="noscript">Для работы интерактивного прототипа включите JavaScript.</p></noscript>
</body>
</html>
